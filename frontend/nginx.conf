# =====================================================================
# DocuFlow AI - Nginx configuration (Docker frontend container)
#
# WHAT THIS FILE DOES
#   1. serves the built React app (single page application)
#   2. forwards every /api/* request to the FastAPI backend
#   3. adds sensible security headers and caching rules
#
# WHY A PROXY IS NEEDED
#   In production the browser talks to ONE origin (port 8080). Nginx
#   forwards API calls to the backend container, so there is no CORS
#   problem and the frontend never needs to know the backend URL.
# =====================================================================

server {
    listen 80;
    server_name _;

    # Where the React build (dist/) lives inside the container
    root /usr/share/nginx/html;
    index index.html;

    # --- Gzip: smaller responses, faster page loads -------------------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               image/svg+xml text/xml;
    gzip_min_length 1024;

    # --- Security headers ---------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- API proxy -----------------------------------------------------
    # BACKEND_URL is substituted at container start from the environment:
    #   docker-compose -> http://backend:8001   (service name)
    #   Render         -> https://<backend>.onrender.com
    # proxy_pass with a variable needs a DNS resolver and SNI for https.
    resolver 8.8.8.8 1.1.1.1 valid=30s ipv6=off;

    location /api/ {
        proxy_pass         ${BACKEND_URL};
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Analysis can take up to the AI timeout (30s) + upload time
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Allow large document uploads (MAX_FILE_SIZE_MB = 10)
        client_max_body_size 12m;
    }

    # Also expose the interactive API docs through the proxy
    location /docs {
        proxy_pass       ${BACKEND_URL};
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass       ${BACKEND_URL};
        proxy_set_header Host $host;
    }

    # --- Static assets (hashed filenames by Vite -> safe to cache) -----
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Single page application fallback ------------------------------
    # Any route the React router handles (/dashboard, /tasks, ...) must
    # return index.html so the client can render it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
