# =====================================================================
# DocuFlow AI - Docker Compose (production-like stack)
#
#   backend  -> FastAPI on port 8001 (internal: backend:8001)
#   frontend -> Nginx on port 8080  (serves React + proxies /api)
#   db       -> PostgreSQL 16 (only reachable by the backend)
#
# HOW TO RUN
#   1. copy .env.example to .env  (adjust SECRET_KEY for real deploys)
#   2. docker compose up --build
#   3. open http://localhost:8080
#
# STOP / RESET
#   docker compose down            (keep data)
#   docker compose down -v         (delete the database volume too)
# =====================================================================

services:
  # --------------------------- Database ---------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: docuflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docuflow_dev_password}
      POSTGRES_DB: docuflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docuflow -d docuflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Port is intentionally NOT published: only the backend may talk to
    # the database. Uncomment for direct debugging if you need it.
    # ports:
    #   - "5432:5432"

  # --------------------------- Backend ----------------------------
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # The app reads these through pydantic-settings (app/core/config.py)
      DATABASE_URL: postgresql+psycopg2://docuflow:${POSTGRES_PASSWORD:-docuflow_dev_password}@db:5432/docuflow
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-long-random-string}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      MOCK_AI: ${MOCK_AI:-true}
      # --- AI provider chain (see documentation/06_ai_providers.md) ---
      AI_PROVIDER_PRIORITY: ${AI_PROVIDER_PRIORITY:-gemini,openrouter,ollama}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
      AI_REQUEST_TIMEOUT: ${AI_REQUEST_TIMEOUT:-60}
      AI_FALLBACK_ENABLED: ${AI_FALLBACK_ENABLED:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-text-embedding-004}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_FALLBACK_MODELS: ${OPENROUTER_FALLBACK_MODELS:-}
      OPENROUTER_FREE_MODELS_ONLY: ${OPENROUTER_FREE_MODELS_ONLY:-true}
      OPENROUTER_ALLOWED_MODELS: ${OPENROUTER_ALLOWED_MODELS:-}
      OPENROUTER_MAX_SPEND: ${OPENROUTER_MAX_SPEND:-0}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      # Inside a container `localhost` is the container itself - set
      # OLLAMA_BASE_URL=http://host.docker.internal:11434 in .env to
      # reach an Ollama running on the host machine.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      # Embeddings are independent from the generation providers.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-auto}
      LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      APP_VERSION: ${APP_VERSION:-1.0.0}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Published so you can open http://localhost:8001/docs directly
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/api/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # --------------------------- Frontend ---------------------------
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"   # http://localhost:8080  (NOT port 8000)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
