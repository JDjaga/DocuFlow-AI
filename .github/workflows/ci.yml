# =====================================================================
# DocuFlow AI - GitHub Actions CI
#
# WHAT THIS FILE DOES
#   On every push / pull request it:
#     1. backend  - installs Python deps and runs the 142 pytest tests
#     2. frontend - installs Node deps and runs a production build
#
# WHY IT EXISTS
#   Catch broken code before it reaches the repository. Both jobs run
#   in parallel and either one failing fails the whole workflow.
#
# NOTE: no secrets are required - tests run in Mock AI mode with a
# temporary SQLite database (see backend/tests/conftest.py).
# =====================================================================

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel an older in-progress run when a new commit arrives
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------- Backend tests -------------------------
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        env:
          # Tests already set their own env in conftest.py; these are a
          # safety net so a stray .env can never leak into CI.
          MOCK_AI: "true"
          SECRET_KEY: ci-secret-key-never-used-outside-tests
        run: |
          # Write the report to a file so the artifact step has something
          # real to upload; still print it to the log and preserve the
          # pytest exit code.
          pytest --tb=short -q > pytest_output.txt 2>&1
          code=$?
          cat pytest_output.txt
          exit $code

      - name: Upload pytest report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: backend/pytest_output.txt
          if-no-files-found: ignore

  # ------------------------- Frontend build ------------------------
  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # npm ci is faster and exact; fallback covers a first run with
        # no lock file yet.
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build for production
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
